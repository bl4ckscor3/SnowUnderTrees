plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
	id 'net.neoforged.moddev' version '2.0.99'
}

version = '1.5'
group = 'bl4ckscor3.mod.snowundertrees'

base {
	archivesName = 'snowundertrees-1.21.7'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
	version = "21.7.23-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "SnowUnderTrees " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}
	}

	mods {
		snowundertrees {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
	//implementation "curse.maven:eternal-winter-273891:4711122"
	implementation "curse.maven:glitchcore-955399:6742885" //serene seasons dependency
	//implementation "curse.maven:kiwi-303657:5834412" //snow real magic dependency
	implementation "curse.maven:moonrise-1096335:6712276"
	implementation "curse.maven:serene-seasons-291874:6747299"
	//implementation "curse.maven:snow-real-magic-308663:4769110"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "Snow Under Trees",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Snow Under Trees",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}